<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Engineering Notebook | Backend, System Design and AI Notes" />
    <meta
      name="description"
      content="Engineering Notebook is a searchable library of practical notes on backend engineering, system design, AI workflows, and product engineering."
    />
    <meta
      name="keywords"
      content="backend engineering, system design, product engineering, AI engineering notes, distributed systems, APIs, software architecture, engineering notebook"
    />
    <meta name="author" content="Engineering Notebook" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#f5f8f6" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Engineering Notebook | Backend, System Design and AI Notes" />
    <meta
      property="og:description"
      content="Practical engineering notes for backend systems, architecture, AI workflows, and product-minded software work."
    />
    <meta property="og:url" content="https://engineering-notebook.com/" />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:site_name" content="Engineering Notebook" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Engineering Notebook | Backend, System Design and AI Notes" />
    <meta
      name="twitter:description"
      content="Searchable notes on backend engineering, system design, AI, and product-focused engineering practice."
    />
    <meta name="twitter:image" content="/favicon.svg" />
    <link rel="canonical" href="https://engineering-notebook.com/" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <title>Engineering Notebook | Backend, System Design and AI Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Engineering Notebook",
        "url": "/",
        "description": "Practical notes on backend engineering, system design, AI workflows, and product engineering.",
        "inLanguage": "en",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script>
      // Apply the saved (or system) theme before first paint so there's no flash
      try {
        var saved = localStorage.getItem('engineering-notebook:theme');
        var dark = saved ? saved === 'dark' : false;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
